name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run has nothing to say about the commit that replaced it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      # Vitest runs on Node, and the server tests use `node:sqlite` to run the
      # real migrations — which needs 22.5 or newer. Pinned rather than left to
      # whatever the runner image ships, so an image update cannot quietly take
      # it away.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # `--frozen-lockfile` so a lockfile that disagrees with package.json fails
      # here rather than silently resolving to something nobody tested.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck and lint
        run: bun run check

      # Unit and end-to-end, in that order. The end-to-end suite starts the real
      # dev server and drives the MCP endpoint over HTTP, applying the D1
      # migrations to a local database first. It needs no secrets: with no
      # `.dev.vars` on a runner, the Worker falls back to the variables in
      # `e2e/environment.ts`.
      - name: Test
        run: bun run test
